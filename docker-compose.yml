services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DEMO_MODE: ${DEMO_MODE:-true}
      DEMO_NOW: ${DEMO_NOW:-2025-12-12T06:00:00Z}
      VAYU_DB_PATH: /app/data/vayu.duckdb
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx,sys; sys.exit(0 if httpx.get('http://localhost:8000/api/v1/health').status_code==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
