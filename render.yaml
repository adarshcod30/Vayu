# Render Blueprint for the VAYU API (services/api).
#
# Deploy: Render dashboard -> New -> Blueprint -> connect this repo. Render
# reads this file and creates the service below. Secrets (marked sync: false)
# are NOT stored here — Render prompts for them once at blueprint creation,
# then they live only in Render's encrypted env var store.
#
# The image is code-only (see deploy/Dockerfile.api); the hot DuckDB is pulled
# from S3 on boot (vayu_core/storage.py -> maybe_pull_on_boot(), called from
# the FastAPI lifespan in services/api/main.py). Run
# `python -c "from vayu_core.storage import push_hot_db; push_hot_db()"`
# locally whenever you want the deployed instance to pick up fresh seed data.
services:
  - type: web
    name: vayu-api
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile.api
    dockerContext: .
    # Deployed on `free` (Starter requires a card on file — 402 without one).
    # 512MB is tight for pandas+LightGBM+DuckDB; verified under a real
    # --memory=512m local run that the memory hardening below (DuckDB memory
    # pragma + trimmed live-fill windows + explicit gc) keeps peak usage under
    # the ceiling. Free tier also sleeps after 15 min idle (a judge's first
    # click eats a ~30-50s cold start) — upgrade to `starter` (needs a card,
    # a few $/mo) to remove both the sleep and the remaining risk margin.
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: AWS_REGION
        value: us-east-1
      - key: VAYU_S3_BUCKET
        value: vayu-s3-bucket
      - key: VAYU_S3_PREFIX
        value: vayu
      - key: BEDROCK_MODEL_ID
        value: us.amazon.nova-pro-v1:0
      - key: SEARCH_PROVIDER
        value: tavily
      # Secrets — Render will prompt for these values; paste from your local
      # .env, never commit them here.
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: DATA_GOV_IN_API_KEY
        sync: false
      - key: OPENAQ_API_KEY
        sync: false
      - key: FIRMS_API_KEY
        sync: false
